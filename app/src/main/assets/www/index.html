<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b55"><title>RENUKA TELECOM & XEROX</title><style>
:root{--navy:#142b55;--blue:#2456a6;--bg:#f3f6fb;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--white:#fff;--green:#087443;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans Bengali',sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:650;cursor:pointer}button.secondary{background:#e8eef8;color:#17345f}button.danger{background:#b42318}button:disabled{opacity:.5}.hidden{display:none!important}.login{max-width:430px;margin:8vh auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 10px 35px #142b5518}.login h1{font-size:23px;color:var(--navy)}.login label,.field{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}.login input,.field input,.field select,.field textarea,input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.muted,.hint{color:var(--muted);font-size:12px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:18px 12px}.brand{font-weight:800;font-size:17px;padding:8px 10px 18px}.brand small{display:block;font-size:11px;opacity:.75;font-weight:400;margin-top:4px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#e7efff;margin:3px 0;padding:11px}.nav button.active,.nav button:hover{background:#ffffff20}.main{padding:20px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{font-size:24px;margin:0;color:var(--navy)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:14px}.metric{font-size:24px;font-weight:800;margin-top:5px}.panel h2{font-size:17px;margin:0 0 12px;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f6f8fc;color:#41516b}.empty{padding:20px;color:var(--muted);text-align:center}.notice{background:#edf4ff;border:1px solid #c9daf7;padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#142b55;color:#fff;padding:12px 16px;border-radius:10px;z-index:99;max-width:90vw}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#e9eff9;font-size:12px}.menuToggle{display:none}.photo{width:42px;height:42px;object-fit:cover;border-radius:6px}.right{text-align:right}.split{display:flex;gap:8px;align-items:center}.split>*{flex:1}.small{font-size:12px}.dangerText{color:var(--red)}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:8px 10px}.brand{padding:5px 7px}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;width:auto;margin:0;font-size:12px;padding:9px}.main{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:19px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.login{margin:4vh 12px}.metric{font-size:20px}}
</style></head><body>
<div id="login" class="login"><h1>📱 RENUKA TELECOM & XEROX</h1><p class="muted">DIPAKESH BERA · KAKDWIP HOSPITAL MORE</p><label>ইমেইল অথবা +91 মোবাইল নম্বর</label><input id="loginId" placeholder="লগইন ইমেইল / +91XXXXXXXXXX" autocomplete="username"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button style="width:100%" onclick="login()">লগইন করুন</button><button class="secondary" style="width:100%" onclick="resetPassword()">ইমেইলে পাসওয়ার্ড রিসেট</button></div><p class="hint">আপনার Supabase Authentication-এ আগে থেকে তৈরি অ্যাকাউন্ট ব্যবহার করুন।</p></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">📱 RENUKA TELECOM & XEROX<small id="who"></small></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="heading">ড্যাশবোর্ড</h1><div class="muted" id="status">Cloud সংযোগ</div></div><div class="split"><span class="pill" id="role"></span><button class="secondary" onclick="logout()">লগআউট</button></div></div><div id="view"></div></main></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js"></script><script>
const $=id=>document.getElementById(id), K=['products','sales','repairs','expenses','recharges','customers','settings','approvals'];let sb,user,role='employee',data={},page='dashboard',channel=null,saveTimer=null;
const labels={dashboard:'ড্যাশবোর্ড',products:'প্রোডাক্ট ও স্টক',sales:'নতুন বিক্রি / বিল',invoices:'বিলের তালিকা',repairs:'রিপেয়ারিং',recharges:'মোবাইল রিচার্জ',customers:'কাস্টমার ও বাকি',expenses:'খরচ',staff:'কর্মচারী',reports:'লাভ-ক্ষতি ও রিপোর্ট',backup:'ব্যাকআপ'};
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}function arr(k){return Array.isArray(data[k])?data[k]:[]}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
async function init(){const c=window.RENUKA_CONFIG||{};if(!c.url||!c.key){toast('app.js-এ Supabase config নেই');return}sb=window.supabase.createClient(c.url,c.key)}init();
async function login(){let v=$('loginId').value.trim(),p=$('password').value;if(!v||!p)return toast('ইমেইল/মোবাইল ও পাসওয়ার্ড দিন');const cred=v.includes('@')?{email:v,password:p}:{phone:v,password:p};const {data:d,error}=await sb.auth.signInWithPassword(cred);if(error)return toast('লগইন ব্যর্থ: '+error.message);user=d.user;const {data:prof,error:pe}=await sb.from('profiles').select('full_name,role,mobile').eq('id',user.id).maybeSingle();if(pe)return toast('প্রোফাইল পড়া যায়নি: '+pe.message);if(!prof){await sb.auth.signOut();return toast('এই ইউজারের profiles রেকর্ড নেই। Admin-কে যোগ করতে হবে।')}role=prof.role||'employee';user.name=prof.full_name||user.phone||user.email||'ব্যবহারকারী';await loadAll();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.name;$('role').textContent=role==='admin'?'ADMIN':'EMPLOYEE';$('status').textContent='Supabase Cloud Sync সংযুক্ত';buildNav();render();subscribe();}
async function resetPassword(){let v=$('loginId').value.trim();if(!v.includes('@'))return toast('পাসওয়ার্ড রিসেটের জন্য ইমেইল লিখুন');const {error}=await sb.auth.resetPasswordForEmail(v,{redirectTo:location.href.split('#')[0]});toast(error?'রিসেট পাঠানো যায়নি: '+error.message:'ইমেইল রিসেট লিংক পাঠানো হয়েছে। Inbox/Spam দেখুন।')}
async function loadAll(){const {data:rows,error}=await sb.from('shop_data').select('data_key,data_value').eq('store_id','renuka-telecom');if(error)throw error;data={};(rows||[]).forEach(r=>data[r.data_key]=r.data_value);K.forEach(k=>{if(!data[k])data[k]=[]})}
async function save(k){if(!user)return;const {error}=await sb.from('shop_data').upsert({store_id:'renuka-telecom',data_key:k,data_value:data[k],updated_by:user.id},{onConflict:'store_id,data_key'});if(error){console.error(error);toast('Cloud সেভ ব্যর্থ: '+error.message);return false}return true}
function subscribe(){channel=sb.channel('renuka-shop-live').on('postgres_changes',{event:'*',schema:'public',table:'shop_data',filter:'store_id=eq.renuka-telecom'},async()=>{try{await loadAll();render()}catch(e){console.error(e)}}).subscribe()}
async function logout(){if(channel)await sb.removeChannel(channel);await sb.auth.signOut();user=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}
function buildNav(){let items=['dashboard','products','sales','invoices','repairs','recharges','customers','expenses','staff','reports','backup'];$('nav').innerHTML=items.map(k=>`<button data-page="${k}" class="${page===k?'active':''}" onclick="go('${k}')">${labels[k]}</button>`).join('')}
function go(k){page=k;render()}function render(){ $('heading').textContent=labels[page]||page;buildNav();let fn={dashboard:dashboard,products:products,sales:sales,invoices:invoices,repairs:repairs,recharges:recharges,customers:customers,expenses:expenses,staff:staff,reports:reports,backup:backup}[page];$('view').innerHTML=fn?fn():'<div class="empty">অপশন পাওয়া যায়নি</div>' }
function dashboard(){let s=arr('sales'),p=arr('products'),e=arr('expenses'),r=arr('recharges'),d=s.filter(x=>x.date===today()),gross=d.reduce((a,x)=>a+ +x.total,0),cost=d.reduce((a,x)=>a+ +x.cost,0);return `<div class="cards"><div class="card"><div class="muted">আজকের বিক্রি</div><div class="metric">${money(gross)}</div></div><div class="card"><div class="muted">আজকের পণ্যের লাভ</div><div class="metric">${money(gross-cost)}</div></div><div class="card"><div class="muted">মোট পণ্য / স্টক</div><div class="metric">${p.length} / ${p.reduce((a,x)=>a+ +x.qty,0)}</div></div><div class="card"><div class="muted">আজকের রিচার্জ</div><div class="metric">${r.filter(x=>x.date===today()).length}</div></div></div><div class="panel"><h2>সাম্প্রতিক বিক্রি</h2>${salesTable(s.slice(-8).reverse())}</div><div class="notice">ডেটা Supabase-এ সংরক্ষিত। একই প্রকল্পে সাইন-ইন করা ডিভাইসগুলিতে পরিবর্তন Realtime-এর মাধ্যমে দেখা যাবে।</div>`}
function products(){return `<div class="panel"><h2>নতুন পণ্য যোগ করুন</h2><div class="grid"><label class="field">পণ্যের নাম<input id="pn"></label><label class="field">ক্যাটাগরি<select id="pc"><option>মোবাইল</option><option>অ্যাক্সেসরিজ</option><option>রিচার্জ কার্ড</option><option>অন্যান্য</option></select></label><label class="field">IMEI / Serial<input id="pi"></label><label class="field">Barcode / SKU<input id="pb"><button class="secondary" onclick="scan('pb')">বারকোড স্ক্যান</button></label><label class="field">কেনা দাম<input id="pco" type="number" min="0"></label><label class="field">বিক্রির দাম<input id="ppr" type="number" min="0"></label><label class="field">পরিমাণ<input id="pq" type="number" min="0" value="1"></label><label class="field">ছবি / ক্যামেরা<input id="photo" type="file" accept="image/*" capture="environment"></label></div><div class="actions"><button onclick="addProduct()">পণ্য সেভ করুন</button></div></div><div class="panel"><h2>স্টক তালিকা</h2><input placeholder="পণ্য / IMEI / বারকোড খুঁজুন" oninput="filterRows(this.value)"><div id="plist">${productTable(arr('products'))}</div></div>`}
function productTable(a){if(!a.length)return '<div class="empty">কোনো পণ্য নেই</div>';return `<div class="tablewrap"><table><tr><th>পণ্য</th><th>ক্যাটাগরি</th><th>IMEI</th><th>Barcode</th><th>কেনা</th><th>বিক্রি</th><th>স্টক</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cat)}</td><td>${esc(x.imei)}</td><td>${esc(x.barcode)}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td>${x.qty}</td></tr>`).join('')}</table></div>`}
function filterRows(q){let a=arr('products').filter(x=>(x.name+' '+x.imei+' '+x.barcode).toLowerCase().includes(q.toLowerCase()));$('plist').innerHTML=productTable(a)}
async function uploadPhoto(file){if(!file)return '';let path=`renuka-telecom/${user.id}/${id()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let {error}=await sb.storage.from('renuka-shop').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;let {data:d,error:e}=await sb.storage.from('renuka-shop').createSignedUrl(path,60*60*24*365);if(e)throw e;return d.signedUrl}
async function addProduct(){let name=$('pn').value.trim(),cost=+$('pco').value,price=+$('ppr').value,qty=+$('pq').value;if(!name||price<0||qty<0)return toast('পণ্যের নাম, দাম ও স্টক দিন');try{let photo=await uploadPhoto($('photo').files[0]);data.products.push({id:id(),name,cat:$('pc').value,imei:$('pi').value.trim(),barcode:$('pb').value.trim(),cost,price,qty,photo,created:Date.now()});if(await save('products')){render();toast('পণ্য Cloud-এ সেভ হয়েছে')}}catch(e){toast('পণ্য/ছবি সেভ হয়নি: '+e.message)}}
function sales(){let p=arr('products');return `<div class="panel"><h2>নতুন বিক্রির বিল</h2><div class="grid"><label class="field">কাস্টমারের নাম<input id="sn" placeholder="নাম"></label><label class="field">মোবাইল<input id="sm" inputmode="numeric"></label><label class="field">পণ্য<select id="sp">${p.map(x=>`<option value="${x.id}">${esc(x.name)} (স্টক ${x.qty})</option>`).join('')}</select></label><label class="field">পরিমাণ<input id="sq" type="number" min="1" value="1"></label><label class="field">প্রতি পিস বিক্রির দাম<input id="spr" type="number" min="0"></label><label class="field">ডিসকাউন্ট<input id="sd" type="number" min="0" value="0"></label><label class="field">জমা টাকা<input id="spaid" type="number" min="0" value="0"></label><label class="field">পেমেন্ট<select id="smet"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank</option></select></label></div><div class="actions"><button onclick="createSale()">বিল তৈরি ও প্রিন্ট</button></div><p class="hint">কর্মচারী ছাড়ের অনুমতি বর্তমানে অ্যাপের UI-তে সীমাবদ্ধ; ডাটাবেসে নিরাপদ Admin approval workflow এখনো সম্পূর্ণ হয়নি।</p></div>`}
async function createSale(){let p=arr('products').find(x=>x.id===$('sp').value),qty=+$('sq').value,price=+$('spr').value||p?.price,discount=+$('sd').value,paid=+$('spaid').value;if(!p||qty<1||qty>p.qty||price<0||discount>qty*price||paid>qty*price-discount)return toast('পণ্য, স্টক, দাম বা পেমেন্ট যাচাই করুন');let total=qty*price-discount;let s={id:id(),date:today(),customer:$('sn').value||'Walk-in',phone:$('sm').value,product:p.name,productId:p.id,imei:p.imei,qty,price,discount,total,cost:qty*p.cost,paid,due:total-paid,payment:$('smet').value,soldBy:user.name,employeeId:user.id};p.qty-=qty;data.sales.push(s);if(await save('products')&&await save('sales')){render();printSale(s)}}
function salesTable(a){if(!a.length)return '<div class="empty">বিক্রির রেকর্ড নেই</div>';return `<div class="tablewrap"><table><tr><th>তারিখ</th><th>বিল</th><th>কাস্টমার</th><th>পণ্য</th><th>পরিমাণ</th><th>মোট</th><th>জমা</th><th>বাকি</th><th>বিক্রেতা</th></tr>${a.map(x=>`<tr><td>${x.date}</td><td>${x.id}</td><td>${esc(x.customer)}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.due)}</td><td>${esc(x.soldBy)}</td></tr>`).join('')}</table></div>`}function invoices(){return `<div class="panel"><h2>বিলের তালিকা</h2>${salesTable(arr('sales').slice().reverse())}</div>`}
function printSale(s){let w=window.open('','_blank');if(!w)return toast('প্রিন্টের জন্য পপ-আপ অনুমতি দিন');w.document.write(`<html><meta charset="utf-8"><title>Invoice</title><body style="font-family:Arial;padding:25px"><center><h2>RENUKA TELECOM & XEROX</h2>DIPAKESH BERA · KAKDWIP HOSPITAL MORE</center><hr>Bill: ${s.id}<br>Date: ${s.date}<br>Customer: ${esc(s.customer)}<br>Mobile: ${esc(s.phone)}<table border="1" cellspacing="0" cellpadding="8" width="100%"><tr><th>Product</th><th>Qty</th><th>Price</th></tr><tr><td>${esc(s.product)}</td><td>${s.qty}</td><td>${money(s.price)}</td></tr></table><p>Discount: ${money(s.discount)}<br>Total: ${money(s.total)}<br>Paid: ${money(s.paid)}<br>Due: ${money(s.due)}<br>Sold by: ${esc(s.soldBy)}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function repairs(){return `<div class="panel"><h2>রিপেয়ারিং জব কার্ড</h2><div class="grid"><label class="field">কাস্টমার<input id="rn"></label><label class="field">মোবাইল<input id="rm"></label><label class="field">ডিভাইস / মডেল<input id="rd"></label><label class="field">IMEI / Serial<input id="ri"></label><label class="field">সমস্যা<input id="rprob"></label><label class="field">চার্জ<input id="rc" type="number"></label><label class="field">জমা<input id="rp" type="number" value="0"></label><label class="field">স্ট্যাটাস<select id="rst"><option>জমা নেওয়া হয়েছে</option><option>কাজ চলছে</option><option>সম্পন্ন</option><option>ডেলিভারি হয়েছে</option></select></label></div><div class="actions"><button onclick="addRepair()">জব কার্ড সেভ</button></div></div><div class="panel"><h2>রিপেয়ারিং রেকর্ড</h2>${arr('repairs').slice().reverse().map(x=>`<p>${x.date} · ${esc(x.name)} · ${esc(x.device)} · ${money(x.charge)} · ${esc(x.status)}</p>`).join('')||'<div class="empty">রেকর্ড নেই</div>'}</div>`}async function addRepair(){let name=$('rn').value.trim(),device=$('rd').value.trim(),charge=+$('rc').value,paid=+$('rp').value;if(!name||!device||paid>charge)return toast('নাম/ডিভাইস/চার্জ যাচাই করুন');data.repairs.push({id:id(),date:today(),name,phone:$('rm').value,device,imei:$('ri').value,problem:$('rprob').value,charge,paid,status:$('rst').value,by:user.name});if(await save('repairs')){render();toast('রিপেয়ারিং রেকর্ড সেভ হয়েছে')}}
function recharges(){return `<div class="panel"><h2>ম্যানুয়াল রিচার্জ এন্ট্রি</h2><div class="grid"><label class="field">অপারেটর<select id="ro"><option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option></select></label><label class="field">মোবাইল নম্বর<input id="rmob" maxlength="10" inputmode="numeric"></label><label class="field">টাকা<input id="ra" type="number" min="1"></label><label class="field">মাধ্যম<select id="rch"><option>Manual</option><option>Iconstar</option><option>Jio POS</option><option>Smart Connect</option><option>Airtel Mitra</option><option>API</option></select></label><label class="field">স্ট্যাটাস<select id="rs"><option>success</option><option>pending</option><option>failed</option></select></label><label class="field">Transaction ID<input id="rt"></label></div><div class="actions"><button onclick="addRecharge()">রিচার্জ সেভ করুন</button></div><p class="hint">এটি রিচার্জের হিসাব রাখে; অপারেটর/রিচার্জ অ্যাপের API সংযোগ আলাদা অনুমোদন ও API credentials ছাড়া চালু হবে না।</p></div><div class="panel"><h2>রিচার্জ রিপোর্ট</h2>${rechargeTable(arr('recharges'))}</div>`}function rechargeTable(a){if(!a.length)return '<div class="empty">রিচার্জ নেই</div>';return `<div class="tablewrap"><table><tr><th>তারিখ</th><th>অপারেটর</th><th>মোবাইল</th><th>টাকা</th><th>মাধ্যম</th><th>স্ট্যাটাস</th><th>কর্মী</th></tr>${a.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.operator}</td><td>${x.mobile}</td><td>${money(x.amount)}</td><td>${esc(x.channel)}</td><td>${x.status}</td><td>${esc(x.by)}</td></tr>`).join('')}</table></div>`}async function addRecharge(){let mobile=$('rmob').value.trim(),amount=+$('ra').value;if(!/^\d{10}$/.test(mobile)||amount<=0)return toast('১০ সংখ্যার মোবাইল ও সঠিক টাকা দিন');data.recharges.push({id:id(),date:today(),operator:$('ro').value,mobile,amount,channel:$('rch').value,status:$('rs').value,txn:$('rt').value,by:user.name});if(await save('recharges')){render();toast('রিচার্জ এন্ট্রি সেভ হয়েছে')}}
function customers(){let m={};arr('sales').forEach(s=>{let k=s.phone||s.customer;m[k]??={name:s.customer,phone:s.phone,total:0,due:0};m[k].total+=+s.total;m[k].due+=+s.due});return `<div class="panel"><h2>কাস্টমার ও বাকি হিসাব</h2>${Object.values(m).map(x=>`<p>${esc(x.name)} · ${esc(x.phone)} · কেনাকাটা ${money(x.total)} · বাকি ${money(x.due)}</p>`).join('')||'<div class="empty">কাস্টমার নেই</div>'}</div>`}
function expenses(){return `<div class="panel"><h2>দোকানের খরচ</h2><div class="grid"><label class="field">বিবরণ<input id="en"></label><label class="field">টাকা<input id="ea" type="number" min="1"></label><label class="field">তারিখ<input id="ed" type="date" value="${today()}"></label></div><div class="actions"><button onclick="addExpense()">খরচ সেভ</button></div></div><div class="panel"><h2>খরচের তালিকা</h2>${arr('expenses').map(x=>`<p>${x.date} · ${esc(x.name)} · ${money(x.amount)} · ${esc(x.by)}</p>`).join('')||'<div class="empty">খরচ নেই</div>'}</div>`}async function addExpense(){let name=$('en').value.trim(),amount=+$('ea').value;if(!name||amount<=0)return toast('বিবরণ ও টাকা দিন');data.expenses.push({id:id(),date:$('ed').value||today(),name,amount,by:user.name});if(await save('expenses')){render();toast('খরচ সেভ হয়েছে')}}
function staff(){return `<div class="panel"><h2>কর্মচারী প্রোফাইল</h2><p>এই প্রকল্পে বর্তমানে Supabase profiles টেবিল থেকে লগইন করা কর্মীদের ভূমিকা পড়া হয়। নতুন কর্মী যোগ করতে Supabase Authentication-এ user তৈরি করে profiles-এ role=employee দিতে হবে।</p><p class="hint">নিরাপত্তার জন্য কর্মী অ্যাকাউন্ট তৈরির অনুমতি এখানে খোলা হয়নি।</p></div><div class="panel"><h2>কর্মচারী অনুযায়ী বিক্রি</h2>${Object.values(arr('sales').reduce((m,s)=>{m[s.soldBy]??={n:0,total:0};m[s.soldBy].n++;m[s.soldBy].total+=+s.total;return m},{})).map(x=>`<p>বিল ${x.n} · মোট ${money(x.total)}</p>`).join('')||'এখনো বিক্রি নেই'}</div>`}
function reports(){let s=arr('sales'),e=arr('expenses'),gross=s.reduce((a,x)=>a+ +x.total,0),profit=s.reduce((a,x)=>a+ +x.total-(+x.cost),0),due=s.reduce((a,x)=>a+ +x.due,0),spent=e.reduce((a,x)=>a+ +x.amount,0);let ops={};arr('recharges').forEach(x=>ops[x.operator]=(ops[x.operator]||0)+1);return `<div class="cards"><div class="card"><div class="muted">মোট বিক্রি</div><div class="metric">${money(gross)}</div></div><div class="card"><div class="muted">পণ্যের আনুমানিক লাভ</div><div class="metric">${money(profit)}</div></div><div class="card"><div class="muted">কাস্টমারের বাকি</div><div class="metric">${money(due)}</div></div><div class="card"><div class="muted">দোকানের খরচ</div><div class="metric">${money(spent)}</div></div></div><div class="panel"><h2>হিসাবের সারাংশ</h2><p>বিক্রির মোট: ${money(gross)}</p><p>পণ্যের আনুমানিক লাভ: ${money(profit)}</p><p>খরচ বাদে আনুমানিক লাভ: <b>${money(profit-spent)}</b></p><p>মোট বাকি: ${money(due)}</p><p>রিচার্জ অপারেটরভিত্তিক: ${Object.entries(ops).map(([k,v])=>k+': '+v).join(' · ')||'কোনো রিচার্জ নেই'}</p><p class="hint">এটি সংরক্ষিত এন্ট্রির উপর ভিত্তি করে প্রাথমিক হিসাব; ক্রয় রিটার্ন, অন্যান্য আয়, কমিশন, কর ও স্টক-অ্যাডজাস্টমেন্ট এখনো পূর্ণাঙ্গ হিসাবের অংশ নয়।</p></div>`}
function backup(){return `<div class="panel"><h2>ডেটা ব্যাকআপ / রিস্টোর</h2><p>সব Shop Data JSON ফাইলে ডাউনলোড করুন। Restore করলে বর্তমান ডেটা প্রতিস্থাপিত হবে। আগে ব্যাকআপ নিন।</p><div class="actions"><button onclick="downloadBackup()">ব্যাকআপ ডাউনলোড</button><label class="field">JSON ব্যাকআপ থেকে রিস্টোর<input id="restoreFile" type="file" accept="application/json"></label><button class="danger" onclick="restoreBackup()">রিস্টোর করুন</button></div></div>`}function downloadBackup(){let blob=new Blob([JSON.stringify({exported:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='renuka-telecom-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}async function restoreBackup(){if(role!=='admin')return toast('শুধু Admin রিস্টোর করতে পারবেন');let f=$('restoreFile').files[0];if(!f)return toast('JSON ফাইল বাছুন');if(!confirm('বর্তমান ডেটা ব্যাকআপ ফাইলের ডেটা দিয়ে প্রতিস্থাপন হবে। চালাবেন?'))return;try{let j=JSON.parse(await f.text());if(!j.data||!confirm('আপনি নিশ্চিত?'))return;for(let k of K)if(j.data[k]){data[k]=j.data[k];if(!await save(k))return}render();toast('ডেটা রিস্টোর হয়েছে')}catch(e){toast('ফাইলটি সঠিক JSON নয়')}}
async function scan(target){if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia)return toast('এই ব্রাউজারে বারকোড ক্যামেরা সমর্থিত নয়; হাতে লিখুন');let stream;try{let detector=new BarcodeDetector();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let v=document.createElement('video');v.srcObject=stream;v.setAttribute('playsinline','');await v.play();let box=document.createElement('div');box.style='position:fixed;inset:8%;z-index:999;background:#111;color:white;padding:14px;border-radius:12px';let b=document.createElement('button');b.textContent='বন্ধ';b.onclick=()=>{stream.getTracks().forEach(t=>t.stop());box.remove()};box.append(b,v);v.style='width:100%;max-height:80%';document.body.append(box);let timer=setInterval(async()=>{try{let codes=await detector.detect(v);if(codes.length){$(target).value=codes[0].rawValue;clearInterval(timer);stream.getTracks().forEach(t=>t.stop());box.remove();toast('বারকোড পড়া হয়েছে')}}catch(e){}},350)}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());toast('ক্যামেরা অনুমতি দিন এবং HTTPS ব্যবহার করুন')}}
</script></body></html>
