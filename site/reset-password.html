<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RENUKA TELECOM – Password Reset</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f3f6fb;margin:0;min-height:100vh;display:grid;place-items:center;color:#172033;padding:16px}
.card{background:#fff;width:min(100%,440px);padding:26px;border-radius:20px;box-shadow:0 10px 35px #142b5518}
h1{font-size:23px;color:#142b55;margin:0 0 10px}p{color:#64748b;line-height:1.6;font-size:15px}
label{display:block;margin:17px 0 7px;font-weight:700}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#0759ad;color:white;font:inherit;font-weight:700;margin-top:18px}
#msg{margin-top:16px;white-space:pre-wrap;font-weight:600}.hidden{display:none}
</style>
</head>
<body><main class="card">
<h1>RENUKA TELECOM & XEROX</h1>
<p>Supabase অ্যাকাউন্টের পাসওয়ার্ড রিসেট করুন। প্রথমে আপনার অ্যাকাউন্টের ইমেইল দিন। ইমেইলে আসা লিংক খুলে নতুন পাসওয়ার্ড সেট করুন।</p>
<section id="request">
<form id="requestForm">
<label for="email">অ্যাকাউন্টের ইমেইল</label>
<input id="email" type="email" autocomplete="email" required placeholder="আপনার Supabase ইমেইল">
<button type="submit">রিসেট লিংক পাঠান</button>
</form></section>
<section id="change" class="hidden">
<form id="changeForm">
<label for="p">নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label>
<input id="p" type="password" minlength="8" autocomplete="new-password" required>
<label for="p2">পাসওয়ার্ড আবার লিখুন</label>
<input id="p2" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit">নতুন পাসওয়ার্ড সেভ করুন</button>
</form></section>
<p id="msg" role="status">রিসেট শুরু করতে ইমেইল লিখুন।</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://djygwqoyurjivbnljkmy.supabase.co';
const SUPABASE_KEY='sb_publishable_nmPlZPR6OMv0gDlHA1s5Qg_lJgvrRgZ';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('msg');
const pageUrl='https://beradipakesh.github.io/renuka-telecom-android/reset-password.html';
function showChange(){document.getElementById('request').classList.add('hidden');document.getElementById('change').classList.remove('hidden');}
(async()=>{
 const hash=new URLSearchParams(location.hash.slice(1));
 const code=new URLSearchParams(location.search).get('code');
 if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error){msg.textContent='রিসেট লিংকটি মেয়াদোত্তীর্ণ বা ব্যবহার করা হয়েছে। আবার রিসেট লিংক নিন।';return;}}
 const {data,error}=await sb.auth.getSession();
 if(error){msg.textContent='সেশন যাচাই করা যায়নি। আবার ইমেইল থেকে নতুন রিসেট লিংক খুলুন।';return;}
 if(data.session || hash.get('type')==='recovery'){showChange();msg.textContent='রিসেট লিংক যাচাই হয়েছে। এখন নতুন পাসওয়ার্ড দিন।';}
})();
document.getElementById('requestForm').addEventListener('submit',async e=>{
 e.preventDefault();const email=document.getElementById('email').value.trim();
 msg.textContent='রিসেট লিংক পাঠানো হচ্ছে…';
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:pageUrl});
 msg.textContent=error?'লিংক পাঠানো যায়নি: '+error.message:'যদি এই ইমেইলে অ্যাকাউন্ট থাকে, তাহলে রিসেট লিংক পাঠানো হয়েছে। ইমেইল Inbox ও Spam দেখুন।';
});
document.getElementById('changeForm').addEventListener('submit',async e=>{
 e.preventDefault();const a=document.getElementById('p').value,b=document.getElementById('p2').value;
 if(a.length<8){msg.textContent='পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।';return;}
 if(a!==b){msg.textContent='দুটি পাসওয়ার্ড মিলছে না।';return;}
 msg.textContent='পাসওয়ার্ড সেভ হচ্ছে…';
 const {data,error}=await sb.auth.updateUser({password:a});
 if(error){msg.textContent='পাসওয়ার্ড পরিবর্তন হয়নি: '+error.message+'। ইমেইলের নতুন রিসেট লিংক দিয়ে আবার খুলুন।';return;}
 msg.textContent='সফল! আপনার নতুন পাসওয়ার্ড সেট হয়েছে। এখন সফটওয়্যারে ফিরে লগইন করুন।';
 document.getElementById('changeForm').reset();
});
</script></body></html>
