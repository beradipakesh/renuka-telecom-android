<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENUKA TELECOM – Password Reset</title>
<style>
body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f3f6fb;margin:0;min-height:100vh;display:grid;place-items:center;color:#172033;padding:16px;box-sizing:border-box}

</style></head><body><main class="card">

<form id="f"><label>নতুন পাসওয়ার্ড</label><input id="p" type="password" minlength="8" autocomplete="new-password" required placeholder="কমপক্ষে ৮ অক্ষর">

<button type="submit">নতুন পাসওয়ার্ড সেভ করুন</button></form><p id="msg">ইমেইলের রিসেট লিংক দিয়ে এই পেজ খুলুন।</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://iiusrgtlcmtbmcsvtbrn.supabase.co';
const SUPABASE_KEY='sb_publishable_XzXrmnHxD5CD5HeAL3b0gA_07vU4knn';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('msg');
(async()=>{const {data,error}=await sb.auth.getSession();if(error)msg.textContent='রিসেট সেশন যাচাই করা যায়নি: '+error.message;else if(data.session)msg.textContent='রিসেট লিংক যাচাই হয়েছে। নতুন পাসওয়ার্ড দিন।';else msg.textContent='ইমেইলে পাওয়া পাসওয়ার্ড রিসেট লিংক দিয়ে এই পেজটি খুলুন।'})();
