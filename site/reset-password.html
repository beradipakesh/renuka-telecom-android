<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142b55"><title>RENUKA TELECOM – Cloud Password Reset</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f3f6fb;margin:0;min-height:100vh;display:grid;place-items:center;color:#172033;padding:16px}
.card{background:#fff;width:min(100%,460px);padding:26px;border-radius:20px;box-shadow:0 10px 35px #142b5518}
h1{font-size:22px;color:#142b55;margin:0 0 10px}p{color:#64748b;line-height:1.6;font-size:14px}
label{display:block;margin:16px 0 7px;font-weight:700}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#0759ad;color:white;font:inherit;font-weight:700;margin-top:18px;cursor:pointer}
button:disabled{opacity:.6}#msg{margin-top:16px;white-space:pre-wrap;font-weight:600;line-height:1.6}.hidden{display:none!important}.ok{color:#087443}.bad{color:#b42318}
</style></head>
<body><main class="card">
<h1>RENUKA TELECOM & XEROX</h1>
<p>আপনার ক্লাউড অ্যাকাউন্টের জন্য নতুন পাসওয়ার্ড দিন। ইমেইলের নিরাপদ রিসেট লিংক দিয়ে এখানে এলে তবেই পাসওয়ার্ড পরিবর্তন হবে।</p>
<section id="change" class="hidden"><form id="changeForm">
<label for="p">নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input id="p" type="password" minlength="8" autocomplete="new-password" required>
<label for="p2">নতুন পাসওয়ার্ড আবার লিখুন</label><input id="p2" type="password" minlength="8" autocomplete="new-password" required>
<button id="saveBtn" type="submit">নতুন পাসওয়ার্ড সেভ করুন</button></form></section>
<p id="msg" role="status">রিসেট লিংক যাচাই করা হচ্ছে…</p>
<p><a href="./index.html">সফটওয়্যারে ফিরে যান</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://iiusrgtlcmtbmcsvtbrn.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_XzXrmnHxD5CD5HeAL3b0gA_07vU4knn';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const msg=document.getElementById('msg');
let recoveryVerified=false;
function showMessage(text,kind=''){msg.textContent=text;msg.className=kind;}
function enablePasswordForm(){recoveryVerified=true;document.getElementById('change').classList.remove('hidden');showMessage('রিসেট লিংক যাচাই হয়েছে। এখন নতুন পাসওয়ার্ড দুবার লিখে সেভ করুন।','ok');}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY') enablePasswordForm();});
(async()=>{
 try{
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error)throw error;enablePasswordForm();return;}
  const hash=new URLSearchParams(location.hash.slice(1));
  if(hash.get('error')||hash.get('error_description')) throw new Error(hash.get('error_description')||hash.get('error'));
  const {data,error}=await sb.auth.getSession();if(error)throw error;
  if(hash.get('type')==='recovery'&&data.session){enablePasswordForm();return;}
  if(data.session && hash.get('type')==='recovery'){enablePasswordForm();return;}
  showMessage('এই পেজে আসার জন্য ইমেইলের রিসেট লিংক ব্যবহার করুন। লিংক মেয়াদোত্তীর্ণ হলে সফটওয়্যারের লগইন স্ক্রিন থেকে আবার রিসেট ইমেইল পাঠান।','bad');
 }catch(e){showMessage('রিসেট লিংক যাচাই করা যায়নি: '+(e.message||'লিংকটি মেয়াদোত্তীর্ণ হতে পারে।')+'। নতুন রিসেট লিংক নিন।','bad');}
})();
document.getElementById('changeForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!recoveryVerified){showMessage('রিসেট লিংক যাচাই হয়নি। নতুন ইমেইল লিংক খুলুন।','bad');return;}
 const a=document.getElementById('p').value,b=document.getElementById('p2').value;
 if(a.length<8){showMessage('পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।','bad');return;}
 if(a!==b){showMessage('দুটি পাসওয়ার্ড মিলছে না।','bad');return;}
 const btn=document.getElementById('saveBtn');btn.disabled=true;showMessage('নতুন পাসওয়ার্ড সেভ হচ্ছে…');
 try{const {error}=await sb.auth.updateUser({password:a});if(error)throw error;showMessage('সফল! ক্লাউড পাসওয়ার্ড পরিবর্তিত হয়েছে। এখন সফটওয়্যারে ফিরে নতুন পাসওয়ার্ড দিয়ে লগইন করুন।','ok');document.getElementById('changeForm').reset();recoveryVerified=false;}
 catch(err){showMessage('পাসওয়ার্ড পরিবর্তন হয়নি: '+(err.message||'আবার চেষ্টা করুন।')+'। প্রয়োজনে নতুন রিসেট লিংক নিন।','bad');}
 finally{btn.disabled=false;}
});
</script></body></html>
